</div><img src="https://api.gigwatt.co/v.gif?p=/work/" alt="" width="1" height="1" style="position:absolute"><script>(() => {
  const p = new URLSearchParams(location.search), f = document.querySelector('form[method="post"]');
  if (!f) return;
  const q = p.get('q'), job = p.get('job'), ref = p.get('ref');
  if (q && f.request && !f.request.value) f.request.value = q.slice(0, 1000);
  if (job && f.job && /^\d+$/.test(job)) f.job.value = job;
  if (ref && f.ref && /^[A-Za-z0-9]{1,12}$/.test(ref)) f.ref.value = ref;
  const src = p.get('src');
  if (src && f.src && /^[A-Za-z0-9_-]{1,20}$/.test(src)) f.src.value = src.toLowerCase();
